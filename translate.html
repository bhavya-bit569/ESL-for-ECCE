<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Instant Translator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            max-width: 600px;
        }
        textarea, select, button {
            width: 100%;
            margin-top: 10px;
            font-size: 16px;
        }
        textarea {
            height: 100px;
        }
        #output {
            margin-top: 20px;
            padding: 10px;
            background: #f1f1f1;
            min-height: 50px;
        }
    </style>
</head>
<body>
    <h2>Quick Translator</h2>
    <label for="inputText">Enter text:</label>
    <textarea id="inputText" placeholder="Type your text here..."></textarea>

    <label for="targetLang">Translate to:</label>
    <select id="targetLang">
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="zh">Chinese</option>
        <option value="ar">Arabic</option>
        <option value="hi">Hindi</option>
        <option value="pt">Portuguese</option>
        <option value="ru">Russian</option>
        <option value="ja">Japanese</option>
        <option value="it">Italian</option>
        <option value="en">English</option>
        <option value="sw">Swahili</option>
    	<option value="yo">Yoruba</option>
   	<option value="ig">Igbo</option>
    	<option value="zu">Zulu</option>
    	<option value="am">Amharic</option>
    	<option value="ht">Haitian Creole</option>
    	<option value="uz">Uzbek</option>
    	<option value="kk">Kazakh</option>
    	<option value="vi">Vietnamese</option>
    	<option value="th">Thai</option>
    	<option value="ko">Korean</option>
    	<option value="bn">Bengali</option>
    	<option value="ta">Tamil</option>
    	<option value="te">Telugu</option>
    	<option value="ml">Malayalam</option>
    	<option value="my">Burmese</option>
    </select>

    <button onclick="translateText()">Translate</button>

    <div id="output"></div>

    <script>
        async function translateText() {
            const text = document.getElementById('inputText').value;
            const targetLang = document.getElementById('targetLang').value;
            const output = document.getElementById('output');

            output.innerText = 'Translating...';

            try {
                const res = await fetch('https://libretranslate.de/translate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        q: text,
                        source: 'auto',
                        target: targetLang,
                        format: 'text'
                    })
                });
                const data = await res.json();
                output.innerText = data.translatedText;
            } catch (err) {
                output.innerText = 'Translation failed. Please try again.';
                console.error(err);
            }
        }
    </script>
</body>
</html>
